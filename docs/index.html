<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>剧集剧情总结墙 · Drama Analysis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0b1120;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #60a5fa;
      --accent2: #a78bfa;
      --accent3: #f472b6;
      --tag-blue: rgba(96,165,250,0.15);
      --tag-purple: rgba(167,139,250,0.15);
      --tag-green: rgba(52,211,153,0.15);
      --tag-orange: rgba(251,146,60,0.15);
      --card-hover: rgba(255,255,255,0.08);
    }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.6;
    }
    .hero {
      position: relative;
      padding: 64px 24px 48px;
      text-align: center;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: 50%;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(96,165,250,0.08) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .hero h1 {
      font-size: 44px;
      font-weight: 900;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 40%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
      position: relative;
      margin-bottom: 12px;
    }
    .hero p {
      font-size: 17px;
      color: var(--text-secondary);
      max-width: 560px;
      margin: 0 auto;
      position: relative;
    }
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 0 24px 32px;
      flex-wrap: wrap;
    }
    .stat-item { text-align: center; }
    .stat-num {
      font-size: 36px;
      font-weight: 900;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .container { max-width: 900px; margin: 0 auto; padding: 0 24px 80px; }
    .series {
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      transition: border-color 0.25s ease;
    }
    .series[open] { border-color: rgba(255,255,255,0.15); }
    .series-header {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 16px 18px;
      cursor: pointer;
      list-style: none;
      user-select: none;
      transition: background 0.25s ease;
      border-radius: 14px;
    }
    .series-header::-webkit-details-marker { display: none; }
    .series-header:hover { background: var(--card-hover); }
    .series-header::after {
      content: '▸';
      margin-left: auto;
      font-size: 16px;
      color: var(--text-muted);
      transform: rotate(0deg);
      transition: transform 0.25s ease;
      align-self: center;
    }
    .series[open] .series-header::after { transform: rotate(90deg); }
    .series-title { font-size: 24px; font-weight: 800; }
    .series-meta { font-size: 13px; color: var(--text-muted); }
    .series-sub { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }
    .episodes {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      padding: 4px 18px 18px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .series[open] .episodes {
      display: grid;
      opacity: 1;
    }
    @starting-style {
      .series[open] .episodes { opacity: 0; }
    }
    .card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      min-width: 0;
    }
    .card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      opacity: 0;
      transition: opacity 0.25s;
      border-radius: 0 3px 3px 0;
    }
    .card:hover {
      background: var(--card-hover);
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-3px);
    }
    .card:hover::before { opacity: 1; }
    .card-cover {
      width: 100%;
      aspect-ratio: 16 / 7;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      display: block;
      background: var(--surface);
    }
    .card-ep { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
    .card-title { font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 8px; }
    .card-summary {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .card-tag { font-size: 11px; padding: 2px 10px; border-radius: 6px; font-weight: 600; }
    .tag-blue   { background: var(--tag-blue);   color: #60a5fa; }
    .tag-purple { background: var(--tag-purple); color: #a78bfa; }
    .tag-green  { background: var(--tag-green);  color: #34d399; }
    .tag-orange { background: var(--tag-orange); color: #fb923c; }
    .empty-state { text-align: center; padding: 80px 20px; }
    .empty-icon { font-size: 72px; margin-bottom: 20px; display: block; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .empty-state h2 { font-size: 22px; color: var(--text); margin-bottom: 8px; }
    .empty-state p { color: var(--text-muted); font-size: 14px; }
    footer { text-align: center; color: var(--text-muted); font-size: 13px; padding: 32px 20px 60px; }
    @media (max-width: 640px) {
      .hero h1 { font-size: 30px; }
      .hero { padding: 40px 16px 32px; }
      .stats-bar { gap: 24px; }
      .stat-num { font-size: 28px; }
      .series-title { font-size: 20px; }
    }
    .search-bar {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 20px;
      position: relative;
    }
    .search-bar input {
      width: 100%;
      padding: 13px 46px 13px 16px;
      font-size: 15px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .search-bar input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(96,165,250,0.15);
    }
    .search-bar input::placeholder { color: var(--text-muted); }
    .search-count {
      position: absolute;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--text-muted);
      pointer-events: none;
      white-space: nowrap;
    }
    .search-results { padding-bottom: 24px; }
    .search-group { margin-bottom: 20px; }
    .search-group-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .search-group-title small { font-weight: 400; color: var(--text-muted); }
    .search-card {
      display: block;
      padding: 12px 14px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .search-card:hover { background: var(--card-hover); border-color: rgba(255,255,255,0.15); }
    .search-card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .search-card-title .unit-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      color: var(--accent2);
      background: var(--tag-purple);
      border-radius: 6px;
      padding: 1px 7px;
      margin-right: 8px;
      vertical-align: 1px;
    }
    .search-card-title .ep-tag {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 13px;
      margin-left: 8px;
    }
    .search-card-ctx {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
      word-break: break-all;
    }
    mark {
      background: rgba(251,146,60,0.35);
      color: #fff;
      border-radius: 3px;
      padding: 0 2px;
    }
    .search-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: 40px 20px;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>剧集剧情总结墙</h1>
    <p>追剧不只看热闹 · 每集关键情节、关键台词、人生启示，一页看懂</p>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat-item"><div class="stat-num" id="totalCount">0</div><div class="stat-label">已总结集数</div></div>
    <div class="stat-item"><div class="stat-num" id="totalDramas">0</div><div class="stat-label">剧集数</div></div>
    <div class="stat-item"><div class="stat-num" id="totalScenes">0</div><div class="stat-label">场景数</div></div>
  </div>

  <div class="search-bar">
    <input id="searchBox" type="search" placeholder="搜索剧名 / 场景 / 中英文台词，如：萧秋水 / Heroic Command / 忘情天书…" autocomplete="off" spellcheck="false">
    <span id="searchCount" class="search-count"></span>
  </div>

  <div class="container">
    <div class="search-results" id="searchResults" style="display:none;"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <span class="empty-icon">📺</span>
      <h2>还没有内容</h2>
      <p>等待第一集剧情总结入库</p>
    </div>
    <div id="seriesList"></div>
  </div>

  <footer>基于 Whisper 语音转录整理 · ASR 专有名词已按语境校正 · 台词为引用转述，细节以正片为准</footer>

  <script>
    (function() {
      function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
      }

      // 从「第 N 集」中提取集号，按数字自然排序（第 2 集 < 第 10 集）
      const epNum = (s) => {
        const m = String(s || '').match(/\d+/);
        return m ? parseInt(m[0], 10) : 0;
      };

      const $ = (id) => document.getElementById(id);

      // 将全部条目按剧分组
      function groupByDrama(all) {
        const groups = {};
        all.forEach(item => {
          const key = item.drama || '未命名剧集';
          if (!groups[key]) groups[key] = [];
          groups[key].push(item);
        });
        return groups;
      }

      // 渲染首页分组列表
      function renderAll(groups, listEl) {
        const dramas = Object.keys(groups);
        listEl.innerHTML = '';
        dramas.forEach(drama => {
          const items = groups[drama].slice().sort((a, b) => epNum(a.episode) - epNum(b.episode));
          const series = document.createElement('details');
          series.className = 'series';

          const total = items.length;
          const first = items[0];
          const metaBits = [total + ' 集已总结'];
          if (first.duration) metaBits.push(first.duration + '/集');

          const header = document.createElement('summary');
          header.className = 'series-header';
          header.innerHTML =
              '<div class="series-title">' + escapeHtml(drama) + '</div>' +
              '<div class="series-meta">' + escapeHtml(metaBits.join(' · ')) + '</div>';

          const episodes = document.createElement('div');
          episodes.className = 'episodes';

          items.forEach(item => {
            const card = document.createElement('a');
            card.className = 'card';
            card.href = item.html;
            card.target = '_blank';

            const cover = item.cover
              ? '<img class="card-cover" src="' + escapeHtml(item.cover) + '" alt="' + escapeHtml(drama + ' ' + (item.episode || '')) + ' 封面" loading="lazy" onerror="this.style.display=\'none\'">'
              : '';

            const tags = [];
            if (item.scenes) tags.push('<span class="card-tag tag-blue">' + item.scenes + ' 个场景</span>');
            if (item.duration) tags.push('<span class="card-tag tag-green">' + escapeHtml(item.duration) + '</span>');

            card.innerHTML =
              cover +
              '<div class="card-ep">' + escapeHtml(item.episode || '') + ' · ' + escapeHtml(item.date || '') + '</div>' +
              '<div class="card-title">' + escapeHtml(item.title || (item.episode || '')) + '</div>' +
              '<div class="card-summary">' + escapeHtml(item.summary || '') + '</div>' +
              '<div class="card-tags">' + tags.join('') + '</div>';

            episodes.appendChild(card);
          });

          series.appendChild(header);
          series.appendChild(episodes);
          listEl.appendChild(series);
        });
      }

      // ---------- 搜索 ----------
      let searchIndex = null;      // 全站全文索引（search-index.json）
      let metaItems = [];          // 元数据（index.json），用于降级搜索

      // 中英文子串匹配：英文不区分大小写，去首尾空格
      function matches(text, q) {
        if (!text) return false;
        return text.toLowerCase().indexOf(q.toLowerCase()) > -1;
      }

      // 构造高亮 HTML：把 query 出现处包上 <mark>（不区分大小写）
      function highlight(text, q) {
        if (!q) return escapeHtml(text);
        const lower = text.toLowerCase();
        const lq = q.toLowerCase();
        const out = [];
        let i = 0;
        while (true) {
          const idx = lower.indexOf(lq, i);
          if (idx === -1) {
            out.push(escapeHtml(text.slice(i)));
            break;
          }
          out.push(escapeHtml(text.slice(i, idx)));
          out.push('<mark>' + escapeHtml(text.slice(idx, idx + q.length)) + '</mark>');
          i = idx + q.length;
        }
        return out.join('');
      }

      // 命中上下文：返回 query 前后各约 40 字符
      function contextAround(text, q, radius) {
        radius = radius || 40;
        const lower = text.toLowerCase();
        const idx = lower.indexOf(q.toLowerCase());
        if (idx === -1) return text.slice(0, radius * 2);
        const start = Math.max(0, idx - radius);
        const end = Math.min(text.length, idx + q.length + radius);
        const seg = text.slice(start, end);
        return (start > 0 ? '…' : '') + seg + (end < text.length ? '…' : '');
      }

      // 渲染搜索结果（按剧分组）
      function renderSearchResults(hits, q) {
        const box = $('searchResults');
        box.style.display = '';
        box.innerHTML = '';
        $('seriesList').style.display = 'none';

        if (!hits.length) {
          box.innerHTML = '<div class="search-empty">未找到与「' + escapeHtml(q) + '」相关的内容，试试剧名、场景标题、中英文台词或角色名</div>';
          $('searchCount').textContent = '';
          return;
        }

        // 按剧分组
        const groups = {};
        hits.forEach(h => {
          if (!groups[h.drama]) groups[h.drama] = [];
          groups[h.drama].push(h);
        });

        const groupNames = Object.keys(groups).sort();
        let html = '';
        groupNames.forEach(name => {
          const list = groups[name];
          html += '<div class="search-group">' +
                  '<div class="search-group-title">' + escapeHtml(name) + '<small>' + list.length + ' 条命中</small></div>';
          list.forEach(h => {
            html += '<a class="search-card" href="' + escapeHtml(h.html + '#' + h.anchor) + '" target="_blank">' +
                    '<div class="search-card-title">' +
                    '<span class="unit-label">' + escapeHtml(h.label) + '</span>' +
                    escapeHtml(h.title) +
                    '<span class="ep-tag">' + escapeHtml(h.episode) + '</span>' +
                    '</div>' +
                    '<div class="search-card-ctx">' + highlight(contextAround(h.text, q), q) + '</div>' +
                    '</a>';
          });
          html += '</div>';
        });
        box.innerHTML = html;
        $('searchCount').textContent = hits.length + ' 条命中';
      }

      // 基于全文索引的搜索
      function searchFulltext(q) {
        const hits = [];
        searchIndex.forEach(rec => {
          // 单元文本之外，额外把剧名/集号/标题纳入匹配（供"第 3 集""赴山海"等检索）
          const recMeta = [rec.drama, rec.episode, rec.title].join(' ||| ');
          rec.units.forEach(u => {
            if (matches(u.text, q) || matches(recMeta, q)) {
              hits.push({
                drama: rec.drama,
                episode: rec.episode,
                title: rec.title,
                html: rec.html,
                anchor: u.id,
                label: u.label,
                text: u.text
              });
            }
          });
        });
        return hits;
      }

      // 降级：仅基于元数据（剧名/集标题/摘要）的搜索
      function searchMeta(q) {
        const hits = [];
        metaItems.forEach(item => {
          const haystack = [item.drama, item.episode, item.title, item.summary].join(' ||| ');
          if (matches(haystack, q)) {
            hits.push({
              drama: item.drama,
              episode: item.episode,
              title: item.title,
              html: item.html,
              anchor: '',
              label: '剧情总结',
              text: item.summary || item.title
            });
          }
        });
        return hits;
      }

      let searchTimer = null;
      function onSearchInput() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          const q = $('searchBox').value.trim();
          const list = $('seriesList');
          const box = $('searchResults');
          if (!q) {
            box.style.display = 'none';
            list.style.display = '';
            $('searchCount').textContent = '';
            return;
          }
          const hits = (searchIndex && searchIndex.length) ? searchFulltext(q) : searchMeta(q);
          renderSearchResults(hits, q);
        }, 200);
      }

      async function loadData() {
        let all = [];
        try {
          const resp = await fetch('index.json?_=' + Date.now());
          if (!resp.ok) throw new Error('Failed');
          all = await resp.json();
        } catch (e) { all = []; }

        if (!all.length) {
          $('emptyState').style.display = '';
          return;
        }

        metaItems = all;
        const groups = groupByDrama(all);
        $('totalCount').textContent = all.length;
        $('totalDramas').textContent = Object.keys(groups).length;
        $('totalScenes').textContent = all.reduce((s, i) => s + (i.scenes || 0), 0);

        renderAll(groups, $('seriesList'));

        // 预加载全文搜索索引（失败时降级为元数据搜索）
        try {
          const resp = await fetch('search-index.json?_=' + Date.now());
          if (resp.ok) searchIndex = await resp.json();
        } catch (e) { searchIndex = null; }

        $('searchBox').addEventListener('input', onSearchInput);
      }

      loadData();
    })();
  </script>
</body>
</html>
